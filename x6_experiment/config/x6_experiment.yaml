# X6 hardware experiment -- the single configuration for the whole campaign.
#
# Brief: HARDWARE_EXPERIMENT.md. Run guide: x6_experiment/RUNNING_THE_EXPERIMENT.md.
# Where the data goes: x6_experiment/experiments.md.
#
# RULES FOR THIS FILE
#   * Fields marked TO_FILL are measured before trial 1 (demo, shelf, pick marks).
#   * Once trial 1 has run, NOTHING under `method:` may change. Every experiment trial hashes
#     this file into every trial record; a changed hash mid-campaign is a finding
#     to report, not an edit to make.
#   * Nothing here is set per hand, per object or per trial, except the physical
#     description of each hand in hands/<hand>.yaml.
#   * Read ONLY when tpgpt_pick_place runs with experiment:=true. With
#     experiment:=false (the default) the nodes behave exactly as before and
#     ignore this file.
#   * `method:` mirrors the planner's and the executor's own defaults, value for value
#     (test_x6.py::test_the_frozen_method_is_what_the_nodes_run fails when they drift).
#     Change a default in a node, then re-sync this file, BEFORE trial 1.
#
# Reworked 2026-09-29 for the setup as moved and recalibrated on 2026-09-26: the named
# shelf slots, the objects that plan, the 18:39 demonstration, the method as the planner
# runs it today. Expect another pass when more grippers work (hands, objects per hand).

experiment:
  name: X6
  run_id: hw_2026_09_x6_r2            # one run_id for the whole campaign, all sessions
                                      # (hw_2026_09_x6 was the pre-move campaign: not evidence)
  data_root: ~/thor_ws/src/ycb_point_cloud/TPGPT_multi_obj_and_embodiment/outputs/hardware
  control_rate_hz: 20                 # time in every record = step_index / control_rate_hz
  topics:                             # read by the X6 recorder only
    color: /camera/camera/color/image_raw
    depth: /camera/camera/aligned_depth_to_color/image_raw
    camera_info: /camera/camera/color/camera_info
    joint_states: /joint_states
    current_pose: /current_pose
    robot_state: /franka_robot_state_broadcaster/robot_state   # wrench + end-effector mass

# ----------------------------------------------------------------------------
# The one demonstration. Recorded ONCE, Franka Hand, banana, into the shelf.
# ----------------------------------------------------------------------------
# The 18:39 demonstration of 2026-09-25: the best measured (192 admissible grasps across
# six objects and three slots; docs/hardware/GRASP_LIBRARY.md, item 6), and the one every
# live plan of 2026-09-26 used.
demonstration:
  object: banana
  hand: panda
  # From its teach.json: set down on the BOTTOM board at (0.608, -0.264), 81 mm from the
  # bottom_left mark and 169 mm from the right one (bottom_left is not in the grid since
  # 2026-10-03; every destination run is on the top board, 248 mm higher).
  placed_at_note: "bottom board, (0.608, -0.264, 0.075) base frame, slid in under the top board"
  recorded_dir: ~/tpgpt_demos/banana_20260925_183904
  # The same demonstration, its attractor learned by replaying it on this arm (audit B1,
  # steps 4-6; passes 0-3 in ~/tpgpt_demos/banana_20260925_183904/replay, 2026-09-30):
  # labels = pass 3's command; taught_labels.npz = the taught path (directional stiffness,
  # source_bundle_directional); arm_path.npz = where the arm went, with its run-to-run
  # margin. One demonstration and one replay serve every hand, object and slot.
  source_bundle_dir: ~/tpgpt_demos/banana_20260925_183904/source_bundle_learned
  sha256:                             # informational; every trial records its own hashes
    arm_path.npz: 8ea97c9771b721560d9fb2e0ac97365c6834a946dc118830da225180e97afff3
    manifest.json: ce181d4279c118766d87a5086453cd9bd011fa7659d67657dfea2b8c8122509b
    placement.npz: 11168ce7085571df0bc7e9899bd274e8985a970f4d656a8be970205ea8c40705
    taught_labels.npz: 98677fdaf2305bb30065f96be8dcbf5bc138f410eb7bcae23857c811ffa3366d
    tool_labels.npz: 70f7296329b026943dbfbf6598802c4cf662892994e90ed65f6775e63e8acb68
  re_record_allowed: false
# ----------------------------------------------------------------------------
# Calibration. The file the planner actually loads is the INSTALLED copy.
# ----------------------------------------------------------------------------
calibration:
  camera_extrinsics_file: ~/thor_ws/install/ycb_pointcloud_pipeline/share/ycb_pointcloud_pipeline/config/camera_calibration.yaml
  # Calibration is verified manually. Trials need no session; the file's sha256
  # is recorded in every record.json.
  session_record: <data_root>/<run_id>/sessions/<session_id>/calibration.json   # optional

# ----------------------------------------------------------------------------
# Factors
# ----------------------------------------------------------------------------
hands:
  # Only the Franka Hand has planned since the 2026-09-26 move. The Inspire hand is kept so
  # its trial ids are reserved; it has not been re-validated on this setup, and this block
  # is revisited when the other grippers work (user, 2026-09-29).
  # The Inspire hand is on the flange since 2026-10-04 (free_drive's gripper_type auto and
  # the X6 trial's default hand read this).
  mounted: inspire
  order: [panda, inspire]             # complete one hand before re-mounting
  files:
    panda: hands/panda.yaml
    inspire: hands/inspire.yaml       # side grasp, no GraspGen-X (INSPIRE_HAND.md)

# Every object that plans into both top slots (2026-09-26), except the banana, which is
# the demonstrated object. Names are config/target_objects.yaml's (topic
# /ycb_pointclouds/<name>), each with its YCB scan and grasp library. The brief asks for 5;
# the fifth (the tomato soup can) plans nowhere upright and was dropped (GRASP_LIBRARY.md).
# Each is set down in its protocol pose (docs/hardware/OPERATOR_CHECKLIST.md): the mug
# opening-up with its handle visible, the pudding box on its long narrow side (88 x 35 mm
# face), the apple upright.
objects:
  - apple
  - mug
  - pudding_box
  - foam_brick

# Pick poses: 3 taped marks on the table, SAME marks for every object and for
# both hands. Spread across the reachable region, each with a different yaw.
# The pick pose is NOT given on the command line: each trial records the object's
# cloud centroid and yaw (principal axis) from the perception frame. The marks
# below are only used by the analysis to label each trial with its nearest mark
# (pick_pose_index); leave them TO_FILL if you prefer to label by clustering.
# Measure x, y by touching the mark with the TCP and reading /current_pose.
pick_poses:
  - {index: 0, x: TO_FILL, y: TO_FILL, yaw_deg: TO_FILL, note: "near-left"}
  - {index: 1, x: TO_FILL, y: TO_FILL, yaw_deg: TO_FILL, note: "centre-far"}
  - {index: 2, x: TO_FILL, y: TO_FILL, yaw_deg: TO_FILL, note: "near-right"}

# Destinations: the planner's named slots, resolved from the touched slot marks in
# shelf_file (tpgpt.hardware.shelf.slots), so no coordinate is typed here. Each trial
# records the resolved (x, y, board height) and the shelf file's sha256. bottom_right is
# abandoned (user, 2026-09-25: 0 admissible on every capture, and the arm reaches it badly);
# bottom_left too (user, 2026-10-03: 0-2 executable grasps an object, placement-dependent, and
# no room for other hands). A third destination, off the shelf, is to be set up later.
# The pick support is inferred by the planner (the table), as outside an experiment.
destinations:
  shelf_file: ~/thor_ws/install/ycb_pointcloud_pipeline/share/ycb_pointcloud_pipeline/config/shelf.yaml
  slots: [top_left, top_right]

# ----------------------------------------------------------------------------
# Grid and order
# ----------------------------------------------------------------------------
grid:
  # trials per hand = 4 objects x 3 pick poses x 2 destinations = 24; total 48
  # Trials are started one at a time by the operator (tpgpt_pick_place
  # experiment:=true trial_id:=...). The order actually run is whatever trial ids
  # were used; follow a randomised order sheet (orders/order_<hand>.csv, generated
  # once from these seeds) so the order is randomised within each hand.
  trials_per_condition: 1
  randomise_within_hand: true
  seeds: {panda: 6001, inspire: 6002}
  trial_ids: {panda: "0001-0024", inspire: "0025-0048"}
  stop_early: false                   # a hand doing badly still finishes its grid

instrument_check:                     # §4 of the brief
  repetitions: 10                     # re-segment each time, object never touched
  object: foam_brick                  # the steadiest detection (255 of 266 frames) and it cannot roll
  location: top_left
  when: [before_first_trial, after_remount, campaign_end]

robustness_check:                     # optional, AFTER both grids, one sentence in the paper
  enabled: true
  n_scenes: 6                         # 3 per hand
  admissible_ranks: [2, 3]            # 2nd and 3rd ADMISSIBLE candidates
  counts_in_main_grid: false

scratch_trials:                       # test trials (trial_id s001, s002), never analysed
  n: 2
  object: TO_FILL                     # any object that is neither a grid object nor the banana

# ----------------------------------------------------------------------------
# METHOD -- frozen. The node defaults, value for value (2026-09-29): tpgpt_planner_node.py,
# tpgpt_executor_node.py, grasp_selection.SelectionSettings. How each key reaches the
# planner: x6_common.PLANNER_METHOD_PARAMETERS; every execution key is an executor
# parameter of the same name. Anything not listed runs at its node default, as it
# does outside an experiment. Identical for both hands.
# ----------------------------------------------------------------------------
method:
  map:
    construction: cube_grasp_pose     # planner.KEYPOINT_BOX grasp_cube, orientation grasp
    cube_half_extent_m: 0.02          # sim.keypoints.GRASP_CUBE_HALF_EXTENT
    min_determinant: 0.1

  perception:
    n_frames: 3
    max_cloud_age_s: 10.0
    workspace_min: [0.15, -0.6, -0.25]
    workspace_max: [0.85, 0.6, 0.5]
    voxel_size: 0.003
    outlier_radius: 0.012
    outlier_min_neighbors: 4
    max_points: 8192
    min_cloud_points: 40              # planner.MIN_CLOUD_POINTS; pre-flight uses this
    segmentation_period_s: 3.0
    detector_mode: grounded_sam
    object_model: true                # the YCB scan fitted to the camera cloud (audit A8)
    object_model_retries: 2           # a refused fit is retried on fresh frames, which the
                                      # trial captures and records itself
    use_scene_cloud: true             # the observed scene is an obstacle to the whole path

  grasp_generation:
    source: graspgenx
    host: 127.0.0.1
    port: 5556
    planner: diffusion
    grasp_library: true               # the object's fixed 2000 grasps (audit A13), carried by the fit
    grasp_library_size: 2000
    num_grasps: 400                   # the live draw: only when the fit is refused, or no cache
    topk: 200
    timeout_s: 30.0
    # The GraspGen-X gripper model is the hand's own description (hands/<hand>.yaml).

  selection:                          # grasp_selection.SelectionSettings
    max_tilt_deg: 90.0                # audit A10 (sim 85)
    check_visibility: auto            # on only when the scan was not fitted (audit A10)
    check_centred: false
    min_support_clearance_m: 0.003
    duplicate_position_m: 0.01
    duplicate_angle_deg: 15.0
    max_plans: 100                    # planned in GraspGen-X's score order (sim 100; user 2026-09-29)
    max_aim_grasp_m: 0.01
    max_orientation_error_deg: 15.0
    min_path_clearance_m: -0.002
    fallback_top_down: false          # the simulation has none; top-down is not preferred (user 2026-09-29)
    grasp_depth_below_top_m: 0.03     # top-down fallback only
    refine: true
    refine_margin_m: 0.003
    refine_max_depth_m: 0.025
    refine_max_centre_m: 0.010
    kinematic_criterion: strict       # every waypoint reachable, the pick and place with orientation
    approach_rejects_grasp: false     # a blocked move onto the path asks for a re-home instead;
                                      # in a trial that is preflight_failed, not counted
    reach_margin_m: 0.02              # the wrist kept 20 mm inside full stretch (2026-10-03)
    retreat_clearance_m: 0.01         # the hand kept 10 mm from the placed object in the retreat (2026-10-03)
    never_force_rank_in_main_grid: true

  execution:                          # tpgpt_executor_node parameters, at its defaults
    # Re-synced 2026-10-01 with the execution rework (audit B1 steps 6 and 8). The trial
    # passes every key below. A LEARNED plan (the demonstration above) runs at the settings
    # it was learned under -- speed_scale 0.35, rotational 30 x1.0, its transported
    # stiffness, no offset compensation -- and those keys here must therefore stay at the
    # node's defaults (a value equal to neither the default nor the learned one is refused),
    # and it is followed against its arm path (follow_arm_path) instead of the lag gate and
    # clamp below, which taught plans still use.
    use_transported_stiffness: false  # default; a learned plan turns it on
    translational_stiffness: 400.0
    speed_scale: 0.35
    lag_tolerance: 0.045              # method 0.035 (CLAUDE.md, executor deviations)
    on_stall: continue                # the lag gate goes off after a stall (taught plans)
    speed_limit_factor: 3.0
    belief_correction: 0.2
    rotational_stiffness: 30.0        # stock CRISP k_rot
    rotational_damping: 12.0
    transit_rotational_scale: -1.0    # default (auto); a learned plan uses 1.0
    max_policy_seconds: 300.0
    stiffness_min_translational: 50.0
    stiffness_max_translational: 900.0
    stiffness_max_rotational: 60.0
    workspace_check: false            # the path check covers it (user 2026-09-23)
    workspace_min: [0.15, -0.6, -0.25]
    workspace_max: [0.85, 0.6, 0.7]
    max_start_distance: 0.6
    plan_joint_tolerance: 0.05
    approach_max_linear_speed: 0.05
    approach_max_angular_speed: 0.3
    approach_settle_tolerance: 0.2
    approach_settle_timeout: 5.0
    max_tracking_error: 0.08
    progress_window: 40
    min_progress_ratio: 0.3
    max_pose_age: 0.2
    settle_time: 1.5
    offset_compensation: z            # default; a learned plan uses none
    max_offset_compensation: 0.03
    arrival_hold: false               # taught plans; a learned plan holds at its marks (path_hold)
    arrival_tolerance: 0.004
    arrival_timeout: 4.0
    arrival_gain: 1.5
    arrival_max_gap: 0.04
    arrival_rotation_tolerance: 0.026  # the holds bring the hand onto the planned orientation too
    arrival_max_rotation: 0.15
    arrival_rotation_release: 1.0
    follow_arm_path: true             # learned plans: tpgpt.hardware.executor.ArmPathSettings
    path_pace_span: 0.02
    path_pacing: true
    path_hold: true
    path_correction: true
    path_correction_gain: 1.5
    path_correction_max: 0.05
    path_unwinding: true
    path_bound_slack: 0.01
    path_blocked_steps: 40
    posture_target: true              # the elbow held on the posture the path check verified
    start_on_path: true               # no run until the hand is on the start of its path (joint controller)
    start_tolerance: 0.004
    start_joint_max_push: 0.2
    posture_max_error: 0.5
    require_confirmation: true        # a refusal = aborted trial, counted
    allow_replan: false               # experiment:=true only: one plan per trial, no "Re-plan?" loop
                                      # (experiment:=false keeps today's re-plan prompt)

  outcome:
    capture_timeout_s: 20.0           # wait for n_frames fresh segmentations (period 3 s)
    # Settled measurement: same fusion as planning, cropped to this box so the shelf
    # slots are inside it (planning crops z at 0.5 m). Also used by x6_instrument_check.
    settled_workspace_min: [0.15, -0.6, -0.25]
    settled_workspace_max: [0.85, 0.6, 0.7]
    # Optional: after a completed policy the arm moves here (TCP pose, base frame,
    # [x, y, z, qx, qy, qz, qw]) at approach speed, to clear the camera view.
    # null = no retreat; clear the view yourself before pressing Ctrl-C.
    retreat_tcp_pose: null
    failure_stages: [planning, approach, reach, grasp, lift, carry, place, settle]
    # Excluded (listed separately, not in the denominator) ONLY for causes outside
    # the method. An E-stop pressed because the planned motion was unsafe is a
    # method failure and COUNTS.
    exclusion_reasons: [network_drop, e_stop_external_cause, camera_driver_crash,
                        robot_container_crash, operator_setup_error]

# ----------------------------------------------------------------------------
# Provenance (read-only; no git commands that change anything)
# ----------------------------------------------------------------------------
provenance:
  repos:                              # the ROS package lives in TPGPT's hardware branch since 2026-09-21
    - ~/thor_ws/src/ycb_point_cloud/TPGPT_multi_obj_and_embodiment
    - ~/thor_ws/src/ycb_point_cloud/6DOF_MultiEmbod_Grasp
  venvs: [~/venvs/tpgpt, ~/venvs/ycb, ~/venvs/graspgenx]
  dirty_tree_policy: warn             # warn now; switch to abort before the real grid
