# Segmentation prompts for X6. Passed to the existing launch file with
#   ros2 launch ycb_pointcloud_pipeline ycb_pipeline.launch.py targets:=<this file>
# so config/target_objects.yaml is left untouched.
#
# Prompts describe what the objects LOOK like. Edit them to match the real items,
# check each one is detected alone on the table BEFORE trial 1, then freeze.
# Cup and mug may be confused by Grounding DINO: only one object is ever on the
# table during a trial, but verify each prompt picks the right item anyway.

target_objects:
  - name: banana            # demonstration object only
    prompt: yellow banana
  - name: apple
    prompt: red apple
  - name: red_cup
    prompt: TO_FILL cup      # e.g. "white paper cup"
  - name: red_mug
    prompt: TO_FILL mug      # e.g. "blue ceramic mug with handle"
  - name: cereal_box
    prompt: TO_FILL box      # e.g. "cereal box"
  - name: can
    prompt: TO_FILL can      # e.g. "red soup can"
