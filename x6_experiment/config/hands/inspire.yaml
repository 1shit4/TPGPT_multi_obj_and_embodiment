# Inspire RH56DFX-2R (a RIGHT hand: user, 2026-10-04) on the FR3. The physical description of
# the hand only. Reworked 2026-10-04 for GraspGen-X grasps; not yet run on the robot. Fields
# marked TO_FILL are measured on the mounted hand (plan M1-M5) and copied here BEFORE this
# hand's first trial, then never changed. The numbers the planner uses are the ones in
# end_effector_config (inspire_hand.yaml); these record them for the paper.
#
# How this hand differs from the Franka Hand in the pipeline (INSPIRE_HAND.md):
#   * GraspGen-X grasps for its own description (inspire_hand, the same right hand), judged
#     on a model of the hand (tpgpt.hardware.inspire_model) instead of the jaw checks;
#   * the plan's grasp point is GraspGen-X's for this hand (between thumb and fingers), its
#     offset from fr3_hand_tcp composed from the mount in end_effector_config and recorded in
#     every plan (metadata.end_effector);
#   * the fingers close through inspire_hand_node (Trigger services), each stopping on its
#     force threshold, and the close reports what each touched.
hand:
  name: inspire
  integrated: true
  end_effector: inspire                         # tpgpt_planner_node end_effector parameter
  end_effector_config: ~/thor_ws/src/ycb_point_cloud/TPGPT_multi_obj_and_embodiment/ycb_pointcloud_pipeline/config/inspire_hand.yaml
  morphology: five_finger_right                 # 6 DOF, 12 joints; thumb opposed for the grasp
  graspgen_gripper: inspire_hand                # = end_effector_config graspgenx.gripper
  geometry_model: tpgpt.hardware.inspire_model.InspireHandModel   # 26-DOP per link + palm boxes
  ee_frame: fr3_hand_tcp                        # controller frame (virtual; robot launched unchanged)
  grasp_to_ee_rotation: tpgpt.hardware.end_effector.EndEffector.grasp_to_ee (from the mount)
  tool_offset: [0.0, 0.0, 0.0]                  # executor correction ADDED to the plan's offset

  measured:                                     # caliper and robot touches, not datasheet
    adapter_thickness_mm: TO_FILL               # flange face -> the hand's wrist face (M2/M3)
    lateral_mm: TO_FILL                         # wrist face centre off the flange axis (M3)
    mount_yaw_deg: TO_FILL                      # palm normal = Rz(yaw) fr3_link8 +X (M1/M3)
    calibrated_depth_mm: TO_FILL                # grasp-depth correction (M6)
    measured_by: TO_FILL
    measured_on: TO_FILL

  desk:                                         # Franka Desk end-effector settings for THIS hand
    mass_kg: TO_FILL                            # hand + adapter plate + screws, weighed
    centre_of_mass_m: TO_FILL                   # in the flange frame, roughly [0, 0, 0.08]
    F_T_EE_translation_m: [0.0, 0.0, 0.1034]    # keep = fr3_hand_tcp, so Desk and ROS agree

  gripper:
    mode: inspire                               # tpgpt_executor_node gripper_mode
    namespace: /inspire_hand                    # inspire_hand_node services ~/open, ~/close
    open_command: /inspire_hand/open            # fingers straight, then thumb opposed
    close_command: /inspire_hand/close          # close_mode; each DOF stops on force
    timeout_s: 20.0
    state_topic: /inspire_hand/joint_states     # URDF joints, rad; effort = grams
    width_topic: null                           # no jaw width; x6 gripper_width stays empty

  mount_check:
    require_services: [/inspire_hand/open, /inspire_hand/close]
    desk_mass_tolerance_kg: 0.05
