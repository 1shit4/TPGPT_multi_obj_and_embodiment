# Inspire RH56 LEFT hand on the FR3. The physical description of the hand only.
# Integrated 2026-09-15 (code; not yet run on the robot). Fields marked MEASURE are
# estimates until someone takes a caliper to the mounted hand -- fill them in BEFORE
# this hand's first trial, then never change them.
#
# How this hand differs from the Franka Hand in the pipeline (INSPIRE_HAND.md):
#   * no GraspGen-X: the planner uses the scripted SIDE grasp for an upright round
#     object (palm first, radial from the robot base), tpgpt.hardware.side_grasp;
#   * the plan's grasp point is the PALM point, not a fingertip centre; the offset
#     from fr3_hand_tcp comes from the mount block of end_effector_config and is
#     recorded in every plan (metadata.end_effector);
#   * the fingers are one fixed open/close through inspire_hand_node (Trigger services),
#     each finger stopping on its force threshold.
hand:
  name: inspire
  integrated: true
  end_effector: inspire                         # tpgpt_planner_node end_effector parameter
  end_effector_config: ~/thor_ws/src/ycb_point_cloud/TPGPT_multi_obj_and_embodiment/ycb_pointcloud_pipeline/config/inspire_hand.yaml
  morphology: five_finger_left                  # 6 DOF, 12 joints; thumb opposed for the grasp
  graspgen_gripper: null                        # not used: side grasp
  geometry_model: tpgpt.hardware.end_effector.inspire_end_effector   # envelope box + palm frame
  ee_frame: fr3_hand_tcp                        # controller frame (virtual; robot launched unchanged)
  grasp_to_ee_rotation: tpgpt.hardware.end_effector.EndEffector.grasp_to_ee (from the mount)
  tool_offset: [0.0, 0.0, 0.0]                  # executor correction ADDED to the plan's palm offset

  measured:                                     # caliper, not datasheet
    adapter_thickness_mm: TO_FILL               # flange face -> hand mounting face
    palm_along_axis_mm: TO_FILL                 # hand mounting face -> palm centre
    palm_normal_offset_mm: TO_FILL              # hand axis -> palm surface
    mount_yaw_deg: -45                          # palm faces fr3_hand_tcp +X (user, 2026-09-15)
    measured_by: TO_FILL
    measured_on: TO_FILL

  desk:                                         # Franka Desk end-effector settings for THIS hand
    mass_kg: TO_FILL                            # hand + adapter plate + screws, weighed
    centre_of_mass_m: TO_FILL                   # in the flange frame, roughly [0, 0, 0.08]
    F_T_EE_translation_m: [0.0, 0.0, 0.1034]    # keep = fr3_hand_tcp, so Desk and ROS agree

  gripper:
    mode: inspire                               # tpgpt_executor_node gripper_mode
    namespace: /inspire_hand                    # inspire_hand_node services ~/open, ~/close
    open_command: /inspire_hand/open            # fingers straight, then thumb opposed
    close_command: /inspire_hand/close          # fingers wrap, then thumb bends; stop on force
    timeout_s: 20.0
    state_topic: /inspire_hand/joint_states     # position = closure 0..1 per DOF
    width_topic: null                           # no jaw width; x6 gripper_width stays empty

  mount_check:
    require_services: [/inspire_hand/open, /inspire_hand/close]
    desk_mass_tolerance_kg: 0.05
