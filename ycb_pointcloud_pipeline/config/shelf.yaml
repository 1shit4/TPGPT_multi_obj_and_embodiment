# The shelf, as the planner's collision model (tpgpt.hardware.shelf.ShelfModel).
#
# Base frame, metres, except tape_mm (millimetres, relative to the shelf). What each key is:
# docs/hardware/SHELF_AND_PATH_CHECK.md; the tape points M1..M14: docs/hardware/shelf_measurements.html.
#
# Shelf frame: +x along the front edge from front_left to front_right, +y INTO the shelf, +z up.
# "left" is the end on the robot's left as it faces the shelf's open front -- the same side as the
# "left slot" in CALIBRATION.md. The builder refuses a swapped pair.
#
# STATUS 2026-09-22: every dimension measured. Heights and the two slot marks were touched by the
# robot (2026-09-21, ~1 mm); the rest is tape (2026-09-22, the user). M1-M4 (slot mark -> panel,
# slot mark -> front edge) were hard to hold square and are the least certain: they place the shelf
# in x/y and set its yaw. The slot-derived width (M1 + 233 + M2 = 576 mm) agrees with the inner
# width M5 (580 mm) to -3.8 mm. The slot marks were touched again the same day (within 4 mm), and
# the cloud disagreement at the panels was traced to the camera (~10 mm sideways at the shelf), so
# there is deliberately no cloud_fit here (docs/hardware/SHELF_AND_PATH_CHECK.md, "First live run").
shelf:
  measured: true

  # ---- The measured shelf ------------------------------------------------------------------
  # The shelf has no back and three boards (bottom, top, topmost). Its own dimensions come from a
  # tape, keyed M1..M14 as marked on the diagram docs/hardware/shelf_measurements.html. The shelf is
  # placed in the robot frame by the points touched on 2026-09-21 (CALIBRATION.md), below.
  # (The pre-tape estimate that stood here is in git history, commit 7d57a00.)
  # RE-TOUCHED 2026-09-26 after the setup was moved by someone else. The shelf itself is back
  # where it was: the slot marks came back within 3.9 and 1.6 mm in x/y and the table within
  # 1.2 mm. The TOP BOARD has been put back DOWN to its original notch, +0.3310 -> +0.3211
  # (0.3213 on 2026-09-21), so the board gap is 244 mm again, not 256.
  # `bottom_board_top` cannot be touched from above (the top board is over it). It is three
  # rests of the finger PADS on it (~/calib_tools/rest_point.py), 0.0730/0.0731/0.0732 -- a 0.2 mm
  # spread, against 2.7 mm for the same measurement on 09-23, and 1.6 mm below that day's 0.0747.
  # The tool's caution line read "body +23 mm", which is the 31.6 - 8.75 mm the hand geometry
  # predicts for a horizontal hand resting on a pad's side face: the body was hanging past the
  # board's front edge, not touching. So the pads were the contact and the reading stands.
  # Previously RE-TOUCHED 2026-09-23, after the camera was bumped and recalibrated. The shelf itself did
  # NOT move: the two slot marks came back within 1.6 and 3.5 mm in x/y, the bottom board within
  # 2.1 mm and the table within 0.9 mm. What changed is the TOP BOARD, re-seated +9.7 mm, so the
  # board gap went 244.5 -> 256.3 mm. Tape cross-check still holds: apron 72 + thickness 18 = 90 mm
  # predicted against 89.2 mm measured from table to bottom board.
  # The bottom board cannot be touched from above (the top board is over it); its height is the
  # mean of three rests of the finger PADS on it, left to right (0.0762, 0.0744, 0.0735 -> 2.7 mm
  # of slope or pad-edge contact), via ~/calib_tools/rest_point.py.
  # Superseded 2026-09-21 values: left [0.6842,-0.2774] right [0.4636,-0.3529]
  #                               bottom 0.0768  top 0.3213  table -0.0136
  anchors:
    left_slot: [0.6884, -0.2758]     # touched 2026-09-26: top shelf, left slot
    right_slot: [0.4634, -0.3505]    # touched 2026-09-26: top shelf, right slot
    bottom_board_top: 0.0731         # rested (pads) 2026-09-26, mean of 3, 0.2 mm spread
    top_board_top: 0.3211            # touched 2026-09-26, mean of the two slot marks
    table: -0.0132                   # touched 2026-09-26, mean of 3
    plate_centre: [0.3772, 0.4983]  # the plate's rim circle, 2026-10-08 (plate: below)
  tape_mm:                             # 2026-09-22
    slot_left_to_left_panel: 201       # M1  (hard to hold square)
    slot_right_to_right_panel: 142     # M2  (hard to hold square)
    slot_left_to_front_edge: 90        # M3  (hard to hold square)
    slot_right_to_front_edge: 92       # M4  (hard to hold square)
    inner_width: 580                   # M5  check: M1 + 233 + M2 = 576, within 6 mm
    left_panel_thickness: 18           # M6
    right_panel_thickness: 18          # M7
    panel_height: 902                  # M8  table -> top edge of the side panels
    panel_depth: 242                   # M9
    panel_front_ahead_of_boards: 0     # M10 flush
    board_depth: 242                   # M11
    topmost_above_top_board: 489       # M12 top board's upper surface -> topmost board's upper surface
    board_thickness: 18                # M13
    apron_height: 72                   # M14 check: 72 + 18 = 90 vs touched bottom board - table = 90.4

  # The four places an object is put, by name: the two slot marks the robot touched
  # (CALIBRATION.md) on each of the two boards it can reach. `tpgpt_planner_node`'s
  # destination_name takes one of these instead of destination: [x, y, z].
  slots:
    top_left:     {xy: left_slot,  board: top_board}
    top_right:    {xy: right_slot, board: top_board}
    bottom_left:  {xy: left_slot,  board: bottom_board}
    bottom_right: {xy: right_slot, board: bottom_board}
    plate:        {xy: plate_centre, board: plate_floor}

  # ---- A plate on the table: a destination off the shelf (the user, 2026-10-08) -------------
  # A round plate, 252 mm across (tape), taped to the table on the robot's left. Touched with the
  # Inspire's pointing index (inspire_touch `m`; the finger's lowest point; 1.1 mm rms against
  # the touched table on 10-05): ~/inspire_mount/touches_20261008_182341.json.
  # - the rim's top, 6 touches around it: a circle of radius 123.8 mm, 0.5 mm rms, its centre the
  #   anchor plate_centre; they lie on a plane tilted 1.3 deg, rising toward the robot's left
  #   (the table rises there too: the camera reads it up to +10 mm at the far left since 09-26),
  #   21.1 mm above the touched table at the centre;
  # - the floor at the centre, 3 touches: -0.0055 (+7.7 mm), 2.1 mm from the circle's centre;
  # - where the flat floor starts rising, 4 touches: 92-104 mm from the centre.
  # Built as boxes by shelf.plate_boxes: the floor (a support, plate_floor) and the rim
  # (plate_rim, 16 segments, two bands).
  plate:
    centre: [0.3772, 0.4983]
    floor: -0.0055
    flat_radius: 0.095
    rim_radius: 0.124
    outer_radius: 0.126
    rim_plane: [0.00757, 0.02177, -0.00587]   # z = a x + b y + c through the rim's top

  # Anything else solid on or around the shelf, as boxes: lo/hi corners in the shelf frame
  # (frame: shelf) or the base frame (frame: base).
  extra_boxes: []

# How the observed cloud is used (tpgpt.hardware.shelf.ShelfWorld).
scene:
  scope: visible                     # visible: everything seen within reach is an obstacle (target,
                                     # table and robot removed); shelf: only what is on the shelf.
                                     # Without /joint_states the robot can't be removed -> shelf.
  roi_margin: 0.03                   # the shelf region (scope shelf, and explained_by_model)
  roi_above_support: 0.30            # ...and this far above the highest board objects stand on
  use_cloud: true                    # false: the model alone
