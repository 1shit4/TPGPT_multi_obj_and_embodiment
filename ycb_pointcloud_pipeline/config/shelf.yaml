# The shelf, as the planner's collision model (tpgpt.hardware.shelf.ShelfModel).
#
# Base frame, metres, except tape_mm (millimetres, relative to the shelf). What each key is:
# docs/hardware/SHELF_AND_PATH_CHECK.md; the tape points M1..M14: docs/hardware/shelf_measurements.html.
#
# Shelf frame: +x along the front edge from front_left to front_right, +y INTO the shelf, +z up.
# "left" is the end on the robot's left as it faces the shelf's open front -- the same side as the
# "left slot" in CALIBRATION.md. The builder refuses a swapped pair.
#
# STATUS 2026-09-22: every dimension measured. Heights and the two slot marks were touched by the
# robot (2026-09-21, ~1 mm); the rest is tape (2026-09-22, the user). M1-M4 (slot mark -> panel,
# slot mark -> front edge) were hard to hold square and are the least certain: they place the shelf
# in x/y and set its yaw. The slot-derived width (M1 + 233 + M2 = 576 mm) agrees with the inner
# width M5 (580 mm) to -3.8 mm. The slot marks were touched again the same day (within 4 mm), and
# the cloud disagreement at the panels was traced to the camera (~10 mm sideways at the shelf), so
# there is deliberately no cloud_fit here (docs/hardware/SHELF_AND_PATH_CHECK.md, "First live run").
shelf:
  measured: true

  # ---- The measured shelf ------------------------------------------------------------------
  # The shelf has no back and three boards (bottom, top, topmost). Its own dimensions come from a
  # tape, keyed M1..M14 as marked on the diagram docs/hardware/shelf_measurements.html. The shelf is
  # placed in the robot frame by the points touched on 2026-09-21 (CALIBRATION.md), below.
  # (The pre-tape estimate that stood here is in git history, commit 7d57a00.)
  anchors:
    left_slot: [0.6842, -0.2774]     # touched: top shelf, left slot
    right_slot: [0.4636, -0.3529]    # touched: top shelf, right slot
    bottom_board_top: 0.0768         # touched
    top_board_top: 0.3213            # touched
    table: -0.0136                   # touched
  tape_mm:                             # 2026-09-22
    slot_left_to_left_panel: 201       # M1  (hard to hold square)
    slot_right_to_right_panel: 142     # M2  (hard to hold square)
    slot_left_to_front_edge: 90        # M3  (hard to hold square)
    slot_right_to_front_edge: 92       # M4  (hard to hold square)
    inner_width: 580                   # M5  check: M1 + 233 + M2 = 576, within 6 mm
    left_panel_thickness: 18           # M6
    right_panel_thickness: 18          # M7
    panel_height: 902                  # M8  table -> top edge of the side panels
    panel_depth: 242                   # M9
    panel_front_ahead_of_boards: 0     # M10 flush
    board_depth: 242                   # M11
    topmost_above_top_board: 489       # M12 top board's upper surface -> topmost board's upper surface
    board_thickness: 18                # M13
    apron_height: 72                   # M14 check: 72 + 18 = 90 vs touched bottom board - table = 90.4

  # The four places an object is put, by name: the two slot marks the robot touched
  # (CALIBRATION.md) on each of the two boards it can reach. `tpgpt_planner_node`'s
  # destination_name takes one of these instead of destination: [x, y, z].
  slots:
    top_left:     {xy: left_slot,  board: top_board}
    top_right:    {xy: right_slot, board: top_board}
    bottom_left:  {xy: left_slot,  board: bottom_board}
    bottom_right: {xy: right_slot, board: bottom_board}

  # Anything else solid on or around the shelf, as boxes: lo/hi corners in the shelf frame
  # (frame: shelf) or the base frame (frame: base).
  extra_boxes: []

# How the observed cloud is used (tpgpt.hardware.shelf.ShelfWorld).
scene:
  scope: visible                     # visible: everything seen within reach is an obstacle (target,
                                     # table and robot removed); shelf: only what is on the shelf.
                                     # Without /joint_states the robot can't be removed -> shelf.
  roi_margin: 0.03                   # the shelf region (scope shelf, and explained_by_model)
  roi_above_support: 0.30            # ...and this far above the highest board objects stand on
  use_cloud: true                    # false: the model alone
