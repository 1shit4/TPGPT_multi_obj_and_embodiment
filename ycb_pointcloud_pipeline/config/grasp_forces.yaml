# Franka Hand grip force per object, N: what the grasp action squeezes with. The executor
# takes the plan's object from here (tpgpt_executor_node.grip_force); -p grasp_force:=N > 0
# overrides it for one run. Set on the robot by the user, 2026-10-03, after runs at 30 N:
#   pudding_box  a light cardboard box: more crushes it
#   apple        held across its middle; it slipped at less
#   banana       it slipped and dropped at 30 N
#   foam_brick   soft: 40 N squashed it
#   mug          a pinch on the rim resists the carry's twist only by friction
# The Franka Hand is rated 70 N continuous: 80 N on the apple is above it (the user's choice;
# it held on the runs).
franka_grasp:
  default: 30.0
  pudding_box: 7.5
  apple: 80.0
  banana: 40.0
  foam_brick: 20.0
  mug: 50.0

# The Inspire hand's per-finger force threshold per object, GRAMS (0-1000; each finger stops
# when its sensor reads this). The executor sets it on /inspire_hand before each close
# (tpgpt_executor_node.inspire_force); -p inspire_force_g:=G > 0 overrides it for one run.
# Set on the bench by the user, 2026-10-05 (plan M7; simultaneous close, the object held in
# the hand by the user):
#   banana, apple  held at 400, also by the fingertips alone (as from a table)
#   mug            held at 400
#   foam_brick     400: it still turns about the contact points at any force tried
#   pudding_box    150: a light cardboard box
inspire_grasp:
  default: 400
  pudding_box: 150
