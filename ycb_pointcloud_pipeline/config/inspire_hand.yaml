# Inspire RH56DFX-2R -- a RIGHT hand -- on the FR3: the single description every node reads.
# Handedness checked 2026-10-04 (user): the box says RH56DFX-2R, and with the palm facing you,
# fingers up, the thumb is on your right. (The 2026-09-15 notes called it a left hand: wrong.)
#
# Read by: inspire_hand_node (serial, grasp, joint map), tpgpt_planner_node /
# tpgpt_pick_place (-p end_effector:=inspire: mount, GraspGen-X description, joint map ->
# tpgpt.hardware.end_effector.inspire_from_config), and the X6 harness through
# x6_experiment/config/hands/inspire.yaml.
#
# Frames (tpgpt/hardware/end_effector.py and inspire_model.py have the arithmetic):
#   fr3_link8       the flange: +Z out of the flange face along the joint-7 axis.
#   fr3_hand_tcp    fr3_link8 turned -45 deg about +Z and moved 0.1034 m along +Z. It stays
#                   in the URDF because the robot is still launched with the Franka Hand
#                   description (load_gripper:=true); with the Inspire hand mounted it is a
#                   fixed virtual point inside the hand's wrist.
#   hand_base_link  the hand's wrist face (where it bolts to the adapter): fingers along its
#                   -Y, palm facing its -X. The RH56 manual's 217.8 mm to the middle
#                   fingertip is from this face; GraspGen-X's URDF agrees (217.9).
#   grasp frame     GraspGen-X's frame of this hand: +Z approach (between the palm normal and
#                   the fingers), +X closing (thumb side), origin the grasp point,
#                   fingertip (0.15 m) along +Z from GraspGen-X's pose origin, less
#                   graspgenx.calibrated_depth_m.
#
# Numbers marked MEASURE are estimates. Measure them before the first run (plan M1-M3):
# every millimetre of mount error lands on the grasp.
# After changing this file: colcon build --packages-select ycb_pointcloud_pipeline.
inspire_hand:
  handedness: right             # RH56DFX-2R (user, 2026-10-04)

  serial:
    port: /dev/ttyUSB0          # CH340 USB-RS485 adapter (1a86:7523), needs the ch341 driver
    baud: 115200
    hand_id: 1                  # `inspire_hand scan`: 2 on 2026-09-15, 1 (the factory default) on 2026-10-05

  grasp:                        # open/close (inspire_hand.py docstring)
    speed: 500                  # 0-1000; 1000 = 0.8 s full stroke
    force_g: 400                # per-finger stop threshold, grams (0-1000); per object:
                                # config/grasp_forces.yaml inspire_grasp (set at each close)
    close_mode: simultaneous    # simultaneous (all together) | sequential (fingers, then the thumb).
                                # The user, 2026-10-05, five objects: simultaneous holds them;
                                # sequential pushes them away (nothing opposes the fingers).
    # Where an EMPTY simultaneous close stops each DOF (little ring middle index thumb_bend
    # thumb_rot; the user, 2026-10-05, 400 g, speed 500): the thumb lands on the middle and
    # index fingers. A close holds something when a finger stops more than 30 beyond this.
    empty_close_angles: [0, 0, 180, 361, 493, 0]
    step_timeout_s: 3.0         # wait per motion step; still moving after it = an error
    state_rate_hz: 10.0         # /inspire_hand/joint_states while idle

  # Register value u (0-1000) -> the URDF joint it drives (GraspGen-X inspire_hand):
  #   q = q_at_0 + (q_at_1000 - q_at_0) * u / 1000        (rad)
  # little/ring/middle/index -> pinky/ring/middle/index_proximal_joint, thumb_bend ->
  # thumb_proximal_pitch_joint, thumb_rot -> thumb_proximal_yaw_joint. Read by the hand
  # node (joint_states in radians) and tpgpt.hardware.inspire_model (the hand's geometry).
  # Measured 2026-10-05 (docs/hardware/INSPIRE_HAND.md, M3 and M4). Still verified: false:
  # * the fingers' OPEN end (q_at_1000): the manual's straight (0.029-0.037) + 0.091 +- 0.008 rad
  #   (5.2 deg towards the palm), from the mount touches. With the hand's ring concentric with
  #   the flange (the user), the index and little fingertips sit 10.6 mm further towards the
  #   palm than the manual's straight puts them; fitted as one bend for both fingers (apart:
  #   index 3.9, little 7.2 deg, +-1). The other two take it too (same mechanism).
  # * the fingers' CLOSED end (q_at_0): 1.373 rad, the ruler's middle-fingertip heights at
  #   1000/750/500/250/0 (216 195 168 125 89 mm) with that open end; within 6 mm of each
  #   (a reading is +-5 mm). Below the URDF's 1.47: GraspGen-X's close curls further than
  #   the real fingers.
  # * the thumb bend: 0.082 (1000) -> 0.650 (0) rad, the ruler's thumb-to-index distances at
  #   1000/750/500/250 (120 92 73 64 mm, between the tips' centres) with the index bent as
  #   above; within 3.3 mm. Against the manual's 0.028-0.690: 0.05 rad more bent when open.
  # * thumb rotation: not measured (the manual's 90-165 deg = the URDF's full 1.308).
  # The hand reports where it really stopped (ANGLE_ACT, a few units short of the command:
  # [997, 996, 999, 1000, 243, 0] for 250 on the thumb, ~0.3 deg); the node maps that.
  joint_map:
    little:     {q_at_0: 1.373, q_at_1000: 0.128, verified: false}
    ring:       {q_at_0: 1.373, q_at_1000: 0.122, verified: false}
    middle:     {q_at_0: 1.373, q_at_1000: 0.123, verified: false}
    index:      {q_at_0: 1.373, q_at_1000: 0.120, verified: false}
    thumb_bend: {q_at_0: 0.650, q_at_1000: 0.082, verified: false}
    thumb_rot:  {q_at_0: 1.308, q_at_1000: 0.0,   verified: false}

  mount:
    # Frame CRISP commands and /current_pose reports. fr3_hand_tcp needs NO change to the
    # robot bringup (the only frame the path check and the FK work in).
    controller_frame: fr3_hand_tcp
    # The hand's axis along the flange's; its palm normal = Rz(yaw) * fr3_link8 +X.
    # MEASURED by touch (M3, 2026-10-05): 15 touches, 8 with the index fingertip
    # (touches_20261005_212605.json), 7 with the little one (touches_20261005_214936.json),
    # fitted with the fingers' bend at 1000 and the offset held at 0, since the ring is
    # concentric with the flange (the user): `python -m tpgpt.hardware.inspire_mount fit
    # <both files> --finger-bend`. Condition 3, rms 1.7 mm (table 1.1, slot marks 2.1; the
    # ring's play is +-2.5 mm at the fingertips). At home the palm faces the robot's base and
    # the thumb is on its left, as the user saw (the first estimate, -45, was half a turn off).
    yaw_deg: 137.11             # +- 1.4
    # Flange face -> the hand's wrist face (its base ring's face), along the axis: 12.45 +- 0.5
    # mm. The 3D-printed mount alone measured 16 by ruler: the hand sits ~3.5 mm deeper (a rim
    # or a recess?), or the model's fingers are a little long.
    adapter_thickness_m: 0.01245
    lateral_m: [0.0, 0.0]       # the ring is concentric with the flange (the user, 2026-10-05)
    adapter_radius_m: 0.0315    # the adapter plate, a body piece of the hand (flange: 63 mm)
    measured: true              # M3, 2026-10-05: by touch, both fingers (above)
    # The hand's ring is held by tape over two loose screws, and rocks about one line: the
    # fingertips swing ~5 mm across the palm, end to end (1.3 deg; +-1.7 mm at the grasp point,
    # across the closing direction). Not modelled (M2b, user 2026-10-05).

  graspgenx:
    # The GraspGen-X description the grasps come from: GraspGen-X's own (inspire_hand, the
    # same right hand) or one measured on this hand (plan stage 5, assets/x_grippers).
    gripper: inspire_hand
    # How much further along the approach the hand goes than the description says, m
    # (plan M6, the depth sweep on the robot, 2026-10-06/07; docs/hardware/INSPIRE_HAND.md):
    # 20 mm back. Held at every depth tried from 10 to 30 mm back on all five objects (24 of
    # 24 runs; the brick also at 0, not at 40): the middle of the band they share. Further
    # back the object sits nearer the fingertips (the user: hold between the fingertips).
    calibrated_depth_m: -0.02
