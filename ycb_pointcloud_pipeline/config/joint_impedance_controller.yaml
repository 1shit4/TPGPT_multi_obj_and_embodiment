# CRISP CartesianController configured as a JOINT impedance controller for the FR3.
#
# Loaded at runtime by joint_target_publisher into the robot container's
# controller_manager (the container sees ~/thor_ws at /workspaces/thor_ws).
#
# How this becomes joint control: all Cartesian task gains are zero and the
# nullspace projector is "none", so the only active term is
#     tau = K * (q_target - q) - D * dq      K = stiffness * weight_i, D = 2*sqrt(K)
# clipped to +-max_tau per joint (+ Coriolis compensation, joint-limit repulsion,
# torque-rate limiting). libfranka already compensates gravity.
#
# These gains are deliberately soft starting values, NOT validated settings for
# your robot, tool or payload. Review them before use on real hardware.
joint_impedance_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    end_effector_frame: fr3_hand_tcp
    base_frame: base
    use_operational_space: false
    task:
      k_pos_x: 0.0
      d_pos_x: 0.0
      k_pos_y: 0.0
      d_pos_y: 0.0
      k_pos_z: 0.0
      d_pos_z: 0.0
      k_rot_x: 0.0
      d_rot_x: 0.0
      k_rot_y: 0.0
      d_rot_y: 0.0
      k_rot_z: 0.0
      d_rot_z: 0.0
    nullspace:
      stiffness: 1.0
      damping: -1.0          # negative -> D_i = 2*sqrt(K_i)
      weights:               # K_i in Nm/rad
        fr3_joint1: {value: 40.0}
        fr3_joint2: {value: 40.0}
        fr3_joint3: {value: 40.0}
        fr3_joint4: {value: 40.0}
        fr3_joint5: {value: 20.0}
        fr3_joint6: {value: 15.0}
        fr3_joint7: {value: 8.0}
      projector_type: none
      regularization: 1.0e-06
      max_tau: 10.0          # Nm, per joint
    filter:
      target_pose: 0.1
      q: 0.5
      dq: 0.5
      q_ref: 0.5
      output_torque: 0.5
    use_friction: false
    use_coriolis_compensation: true
    use_gravity_compensation: false   # libfranka already compensates gravity
    use_local_jacobian: true
    topics:                  # private topics: /joint_impedance_controller/target_joint etc.
      target_pose: ~/target_pose
      target_joint: ~/target_joint
      target_wrench: ~/target_wrench
    limit_error: true
    limit_torques: true
    max_delta_tau: 0.5
    stop_commands: false
    joint_limit_repulsion:
      enabled: true
      safe_range: 0.1
      max_torque: 5.0
    noise:
      add_random_noise: false
      amplitude: 0.0
    variable_stiffness:
      enabled: false
    enable_introspection: false
    log:
      enabled: false
      robot_state: false
      control_values: false
      limits: false
      controller_parameters: false
      computed_torques: false
      dynamic_params: false
      timing: false
