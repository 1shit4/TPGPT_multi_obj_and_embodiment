# Objects to detect. Only these get a point cloud, published on
# /ycb_pointclouds/<name>. Objects not listed are ignored.
#
# Each entry is either
#   - a plain string:           - banana            -> topic /ycb_pointclouds/banana
#   - or name + text prompt:    - name: master_chef_can
#                                 prompt: blue coffee can
#                                 threshold: 0.25   # optional, this object only
#                                 max_size: 0.142   # optional, m: largest dimension
# The prompt is what Grounding DINO searches for, so describe what the object
# LOOKS like -- brand names from the YCB list ("master chef", "jell-o") are
# often not recognised, visual descriptions are.
#
# `threshold` overrides the node's box_threshold (0.35) for that object alone, so
# one object that scores low does not drag the bar down for the others. Set it
# from measurement, not from memory: run the node with save_frames:=misses, then
#   ros2 run --prefix python3 ycb_pointcloud_pipeline prompt_bench \
#       --frames ~/ycb_detection_frames --object <name> --prompts "..." "..."
# which replays the saved frames and reports each wording's WORST frame.
#
# `max_size` is the object's largest dimension, m -- the diameter of its YCB scan. A box that
# measures more than size_margin (1.5) times that, at the depth it shows, is refused for that
# object before the best box is chosen. Measured 2026-09-25: with the pudding box off the table
# its prompt found the shelf, at 0.25-0.40 -- as high as the real box scores -- over 72 000
# pixels against 2 000. No threshold separates those; size does, by 35 times.

target_objects:
  # - name: master_chef_can
  #   prompt: blue coffee can
  # - name: cracker_box
  #   prompt: red cracker box
  # - name: sugar_box
  #   prompt: yellow sugar box
  # - name: tomato_soup_can
  #   prompt: red soup can
  - name: banana
    prompt: banana
    max_size: 0.198
  # Prompts and thresholds below (2026-09-25) were chosen by replaying the node's own detection
  # on 157 labelled frames -- six scenes, each recorded with a known set of objects on the table
  # (~/ycb_detection_frames) -- and they describe what the camera SEES: the pudding box is a small
  # printed (mostly white) box, the foam brick is dark brown, and the mug and the apple are both
  # red and round. Replayed, the old set published an absent object 17 times (the mug on the
  # apple 13, the pudding box on the brick 4) and found the apple in 22 of 49 frames; this set
  # publishes nothing absent and finds apple 48/49, mug 47/47, pudding box 51/59, brick 46/63.
  # Each threshold sits between that object's lowest score when present and its highest when
  # absent (docs/hardware/SEGMENTATION.md). Change one prompt and the others' scores change too:
  # re-run the replay, do not tune by hand.
  - name: apple
    prompt: red apple
    threshold: 0.41           # present >= 0.43, absent <= 0.39
    max_size: 0.085
  # - name: cracker_box
  #   prompt: small red box      # "cracker box" scored < 0.2 in the full caption, this 0.67
  # - bleach_cleanser
  # - mustard_bottle
  # - spam
  # - red cup
  # Back 2026-09-25, in place of the soup can (measured: docs/hardware/GRASP_LIBRARY.md).
  # It was taken away on 2026-09-23 because while listed it matched a cup behind the robot at
  # 0.75, whose cloud then failed the workspace crop -- so either that cup is out of the
  # camera's view, or this prompt and its threshold are chosen from saved frames with
  # prompt_bench (docs/hardware/SEGMENTATION.md).
  - name: mug
    prompt: red cup with a handle
    threshold: 0.50           # present >= 0.56, absent <= 0.45 ("red mug" found the apple at 0.46)
    max_size: 0.125
  - name: pudding_box
    prompt: small printed box   # "brown chocolate pudding box" found the brown foam brick
    # Measured 2026-09-25 14:42, pudding box and foam brick both on the table, correctly
    # identified: the box was published on 320 of 605 cycles, flickering frame to frame, and
    # when published it scored 0.35-0.44 (median 0.39, 26 frames at 0.35) -- right on the
    # shared 0.35 cutoff. 0.25 is for this object only; every miss now logs its score, so the
    # next run shows whether 0.25 is enough (docs/hardware/SEGMENTATION.md).
    threshold: 0.32           # present >= 0.28 (median 0.50), absent <= 0.31 (one frame: a hand placing the brick)
    max_size: 0.142
  - name: foam_brick
    prompt: dark brown block    # it is not red
    threshold: 0.26           # never scored on a frame without it
    max_size: 0.102
  # Taken away 2026-09-25: upright it plans into no slot at all. The hand can only grip it
  # around its 68 mm barrel, so 57 of its 60 screened grasps are past 60 degrees of tilt, and
  # beyond about 45 degrees the transport map folds. The mug above is the same task with a rim
  # to hold. (Lying down it does plan -- 6 and 4 at the top slots, 0 at bottom_left -- but a
  # can laid on a shelf board rolls.)
  # - tomato_soup_can
