[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tpgpt"
version = "0.1.0"
description = "Policy transportation via keypoint parameterization and transportation maps"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "similaritymeasures>=1.4",
    "imageio>=2.30",
]


[project.optional-dependencies]
sim = ["mujoco>=3.1", "robosuite>=1.5"]
# Client only. GraspGen-X itself runs out of process in its own Python 3.11
# environment; nothing here pulls in torch. See tpgpt/grasp/client.py.
graspgen = ["pyzmq>=25", "msgpack>=1.0", "msgpack-numpy>=0.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["tpgpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "sim: requires the MuJoCo/robosuite simulator (slower)",
    "slow: takes more than a few seconds",
    "graspgen: requires the external GraspGen-X server (skipped when unreachable)",
]
